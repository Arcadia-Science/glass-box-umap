[build-system]
requires = ["uv_build>=0.6.6"]
build-backend = "uv_build"

[project]
name = "glass-box-umap"
version = "0.0.0"
description = "This package augments UMAP by computing exact feature contributions to the UMAP embedding."
authors = [
  {name = "James Golden", email = "james.golden@arcadiascience.com"},
  {name = "Evan Kiefl", email = "kiefl.evan@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
# TODO: We'll eventually want to increase dependency resolution radius
dependencies = [
    "numpy>=1.26.4,<2",
    "pandas>=2.2.3,<3",
    "leidenalg>=0.10.2,<0.11",
    "lightning-utilities>=0.15.2,<0.16",
    "dill>=0.4.0,<0.5",
    "einops>=0.8.1,<0.9",
]


# https://github.com/python-poetry/poetry/issues/6409#issuecomment-2203773939
#torchmetrics
#pytorch-lightning
#torch

[project.urls]
Homepage = "https://github.com/Arcadia-Science/glass-box-umap"
Repository = "https://github.com/Arcadia-Science/glass-box-umap"
Documentation = "https://github.com/Arcadia-Science/glass-box-umap/blob/main/README.md"

[dependency-groups]
dev = [
    "pre-commit==4.5.0",
    "pyright==1.1.407",
    "pytest==9.0.1",
    "ruff==0.14.7",
]
docs = [
    "sphinx==8.1.3",
    "sphinx-copybutton==0.5.2",
    "furo==2024.8.6",
    "myst-parser==4.0.1",
    "sphinx-autoapi==3.6.0",
    "sphinx-tabs==3.4.7",
    "nbsphinx==0.9.7",
    "sphinx-autobuild==2024.10.3",
    "sphinx-togglebutton==0.3.2",
    "astroid==3.3.11",
    # Jupyterlab and matplotlib are needed for notebook rendering.
    "jupyterlab==4.2.5",
    "matplotlib==3.9.2",
]

[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports.
src = ["."]
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Ignore star and unused imports.
"__init__.py" = ["F403", "F405"]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "W",  # pycodestyle warning
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["./.venv", "./dist"]

# Pyright reports a lot of unknown-member errors for some packages.
# If this is a problem, set this to `false`.
reportUnknownMemberType = true
