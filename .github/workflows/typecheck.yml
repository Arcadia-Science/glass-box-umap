name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "typecheck"
      - name: Set up Python
        run: uv python install  # Determines version from .python-version

      # --frozen ensures CI fails if uv.lock is out of sync with pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen --group dev

      # ADD THIS STEP -----------------------------------------
      - name: 🔍 PROOF - Check Cache Size
        run: |
          # Dynamically find where uv is storing files
          CACHE_DIR=$(uv cache dir)
          echo "UV Cache is located at: $CACHE_DIR"

          echo "=== Total Size ==="
          du -sh "$CACHE_DIR"

          echo ""
          echo "=== Top 10 Largest Files/Folders ==="
          # Check the size of the specific 'wheels' folder where downloads live
          du -ah "$CACHE_DIR" | sort -rh | head -n 15
      # -------------------------------------------------------
      - name: Run type check
        run: uv run make typecheck
