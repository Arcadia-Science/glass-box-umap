name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "typecheck"
      # ADD THIS STEP -----------------------------------------
      - name: 🔍 PROOF - Check Cache Size
        run: |
          echo "=== Total Size of UV Cache ==="
          du -sh /home/runner/.cache/uv

          echo ""
          echo "=== Top 10 Largest Folders in Cache ==="
          du -ah /home/runner/.cache/uv | sort -rh | head -n 10
      # -------------------------------------------------------
      - name: Set up Python
        run: uv python install  # Determines version from .python-version

      # --frozen ensures CI fails if uv.lock is out of sync with pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run type check
        run: uv run make typecheck
