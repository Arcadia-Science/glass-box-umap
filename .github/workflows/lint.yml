name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.6"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install linting dependencies
        run: uv sync --only-group dev --no-install-project

      - name: Run lint
        run: uv run make lint
