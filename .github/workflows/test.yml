name: test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Cache invalidates if any of these glob patterns hit.
          cache-dependency-glob: |
            **/uv.lock
          cache-suffix: "python-${{ matrix.python-version }}-${{ matrix.os }}"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra plotting --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync make test
